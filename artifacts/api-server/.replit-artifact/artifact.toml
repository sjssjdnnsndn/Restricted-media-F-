kind = "api"
previewPath = "/api"
title = "Telegram Main Bot API"
description = "The running Telegram main bot service with a public health endpoint and status API."
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash run-bot.sh"

[services.env]
BOT_SESSION_NAME = "tg_dl_bot_dev"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["bash", "run-bot.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
BOT_SESSION_NAME = "tg_dl_bot_prod"

[services.production.health.startup]
path = "/api"
